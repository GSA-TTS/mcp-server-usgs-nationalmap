[project]
name = "mcp-server-usgs-nationalmap"
version = "0.1.0"
description = "MCP server for the USGS NHDPlus High Resolution hydrography ArcGIS REST service"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=3.4.6",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "arize-phoenix>=18.0.0",
    "arize-phoenix-client>=2.13.0",
    "arize-phoenix-evals>=3.1.1",
    "langchain>=1.3.14",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.3.5",
    "openinference-instrumentation-langchain>=0.1.67",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydro_mcp"]
